name: Release Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  # ── 1. Generate a dev version (auto patch + dev suffix) ───────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate dev version
        id: meta
        run: |
          BASE=$(node -p "require('./package.json').version" | awk -F. '{print $1"."$2}')
          DEV_VERSION="${BASE}.0-dev.${{ github.run_number }}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing: v${DEV_VERSION}"

  # ── 2. Build and upload (all platforms in parallel) ───────────────────
  # electron-builder --publish always creates the draft release on first run;
  # the other two platform jobs find it and upload their assets to it.
  build:
    needs: [version]
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libfuse2 (Linux — required for AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: bun install

      - name: Stamp dev version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electron app
        run: bun run electron:build

      - name: Package and publish to draft release
        run: bunx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Publish (un-draft) the pre-release ─────────────────────────────
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Valstine Studio ${{ needs.version.outputs.tag }}"
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ## Valstine Studio ${{ needs.version.outputs.tag }} — Development Build

            > ⚠️ **Pre-release** — built from `dev` branch. Not recommended for production use.

            **Commit:** `${{ github.sha }}`
            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ---

            ### 📦 Downloads

            | Platform | Installer |
            |----------|-----------|
            | macOS | `Valstine-Studio.dmg` |
            | Windows | `Valstine-Studio-Setup.exe` |
            | Linux | `Valstine-Studio.AppImage` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
