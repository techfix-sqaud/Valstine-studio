name: Release Dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  # ── 1. Generate version: v{major}.{minor}.{next-patch}-dev.{run} ─────────────
  # Patch is derived from the highest existing stable tag for this major.minor,
  # so the dev build always shows the version it will become once merged to main.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate dev version
        id: meta
        run: |
          # major.minor from package.json
          BASE=$(node -p "require('./package.json').version" | grep -oP '^\d+\.\d+')

          # Next patch = number of existing stable tags for this series + 1
          ESCAPED=$(echo "$BASE" | sed 's/\./\\./g')
          STABLE_COUNT=$(git tag --list "v${BASE}.*" | grep -vE '\-dev' | wc -l | tr -d ' ')
          NEXT_PATCH=$((STABLE_COUNT))

          DEV_VERSION="${BASE}.${NEXT_PATCH}-dev.${{ github.run_number }}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing: v${DEV_VERSION}"

  # ── 2. Build all platforms in parallel ────────────────────────────────────────
  build:
    needs: [version]
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libfuse2 (Linux — required for AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: bun install

      - name: Stamp dev version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electron app
        run: bun run electron:build

      - name: Package and publish to draft release
        run: bunx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Un-draft and mark as pre-release ────────────────────────────────────────
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --draft=false \
            --prerelease \
            --title "Valstine Studio ${{ needs.version.outputs.tag }}" \
            --notes "## Valstine Studio ${{ needs.version.outputs.tag }} — Development Build

          > ⚠️ **Pre-release** — built from \`dev\` branch. Not for production use.

          **Commit:** \`${{ github.sha }}\`
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ### Downloads

          | Platform | Installer |
          |----------|-----------|
          | macOS | \`Valstine-Studio.dmg\` |
          | Windows | \`Valstine-Studio-Setup.exe\` |
          | Linux | \`Valstine-Studio.AppImage\` |"
