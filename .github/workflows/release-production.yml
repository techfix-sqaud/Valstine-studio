name: Release Production

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Auto-calculate the next patch version from git tags ─────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: meta
        run: |
          # Read major.minor from package.json (you control this for breaking/feature releases)
          BASE=$(node -p "require('./package.json').version" | awk -F. '{print $1"."$2}')

          # Find the highest existing patch for this major.minor series
          ESCAPED=$(echo "$BASE" | sed 's/\./\\./g')
          LATEST=$(git tag --sort=-v:refname | grep -E "^v${ESCAPED}\.[0-9]+$" | head -1)

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | awk -F. '{print $3}')
            PATCH=$((PATCH + 1))
          fi

          VERSION="${BASE}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing: v${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vE '\-dev\.' | head -1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log $RANGE --pretty=format:"%s" --no-merges \
            | grep -E "^feat" | sed 's/^feat[^:]*: //' | sed 's/^/- /' | head -20 || true)
          FIXES=$(git log $RANGE --pretty=format:"%s" --no-merges \
            | grep -E "^fix" | sed 's/^fix[^:]*: //' | sed 's/^/- /' | head -20 || true)
          IMPROVEMENTS=$(git log $RANGE --pretty=format:"%s" --no-merges \
            | grep -E "^(refactor|perf|improve)" | sed 's/^[^:]*: //' | sed 's/^/- /' | head -10 || true)

          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$IMPROVEMENTS" ]; then
              echo "### ⚡ Improvements"
              echo "$IMPROVEMENTS"
              echo ""
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Create a draft release with the changelog ──────────────────────
  create-release:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Valstine Studio ${{ needs.version.outputs.tag }}"
          draft: true
          prerelease: false
          body: |
            ## Valstine Studio ${{ needs.version.outputs.tag }}

            ${{ needs.version.outputs.changelog }}

            ---

            ### 📦 Downloads

            | Platform | Installer | Notes |
            |----------|-----------|-------|
            | macOS | `Valstine-Studio.dmg` | Universal binary (Apple Silicon + Intel) |
            | Windows | `Valstine-Studio-Setup.exe` | NSIS installer |
            | Linux | `Valstine-Studio.AppImage` | No install required — make executable and run |

            > **Auto-updates**: Once installed, Valstine Studio checks for updates automatically and notifies you when a new version is ready.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build and upload to draft release (all platforms in parallel) ───
  build:
    needs: [version, create-release]
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install libfuse2 (Linux — required for AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: bun install

      - name: Stamp auto-calculated version into package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Electron app
        run: bun run electron:build

      - name: Package and publish to draft release
        run: bunx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publish (un-draft) once all platform builds succeed ────────────
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
